<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp emulado</title>
<link rel="stylesheet" href="/marca/tokens.css">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: var(--cantera);
    font-family: "Segoe UI", sans-serif;
    color: #111b21;
  }
  .fono {
    width: min(420px, 100%);
    height: min(760px, 100vh);
    background: #efeae2;
    display: flex; flex-direction: column;
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
  }
  header {
    background: var(--tinta); color: var(--hoja);
    padding: 14px 16px 12px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  header strong { display: block; font-size: 16px; }
  header span { display: block; font-size: 12px; opacity: .85; }
  .pill { background: var(--jamaica); border-radius: 999px; padding: 4px 8px; font-size: 11px; white-space: nowrap; }
  .quien { display: flex; gap: 8px; padding: 8px 10px; background: #f0f2f5; }
  .quien input { flex: 1; border: 0; border-radius: 8px; padding: 8px 10px; font: inherit; }
  #log { flex: 1; overflow: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .burbuja { max-width: 82%; padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; line-height: 1.35; font-size: 14.5px; }
  .user { align-self: flex-end; background: #d9fdd3; border-top-right-radius: 0; }
  .bot { align-self: flex-start; background: white; border-top-left-radius: 0; }
  form { display: flex; gap: 8px; padding: 10px; background: #f0f2f5; }
  form input { flex: 1; border: 0; border-radius: 999px; padding: 12px 14px; font: inherit; }
  form button { background: var(--tinta); color: var(--hoja); border: 0; border-radius: 999px; padding: 0 16px; font-weight: 700; }
  #k[hidden] { display: none !important; }
</style>
</head>
<body>
<section class="fono">
  <header>
    <div>
      <strong>Estética Demo</strong>
      <span>Agente bancario · misma entrada que Meta</span>
    </div>
    <div class="pill">Emulado</div>
    <a class="pill" href="/simulacion" style="color:inherit;text-decoration:none">Mesa en vivo</a>
  </header>
  <div class="quien">
    <input id="tel" value="5522222222" inputmode="numeric" aria-label="Tu número, 10 dígitos">
    <input id="k" type="password" placeholder="Clave" aria-label="Clave">
  </div>
  <div id="log"></div>
  <form id="f">
    <input id="texto" placeholder="Escribe un mensaje" autocomplete="off">
    <button>Enviar</button>
  </form>
</section>
<script>
const params = new URLSearchParams(location.search);
if (params.get("k")) {
  document.querySelector("#k").value = params.get("k");
  document.querySelector("#k").hidden = true;
}
const log = document.querySelector("#log");
function burbuja(clase, texto) {
  const d = document.createElement("div");
  d.className = "burbuja " + clase;
  d.textContent = texto;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
document.querySelector("#f").onsubmit = async (ev) => {
  ev.preventDefault();
  const texto = document.querySelector("#texto").value.trim();
  const telefono10 = document.querySelector("#tel").value.trim();
  const k = document.querySelector("#k").value.trim();
  if (!texto) return;
  document.querySelector("#texto").value = "";
  burbuja("user", texto);
  const r = await fetch("/api/chat?k=" + encodeURIComponent(k), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({telefono10, texto})
  });
  if (!r.ok) { burbuja("bot", "No pude entrar. Revisa la clave y el teléfono."); return; }
  const data = await r.json();
  burbuja("bot", data.respuesta || "...");
};
</script>
</body>
</html>
