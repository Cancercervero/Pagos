<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d4145a">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Anillo</title>
<style>
  :root {
    --tinta: #24160f;
    --suave: #6d5344;
    --hoja: #fff6ec;
    --rosa: #d4145a;
    --papel: #fffdf8;
    --borde: #efd3a4;
    --hilo: #5c3318;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: #f3d7a4;
    color: var(--tinta);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.4;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: transparent; border: 0; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--rosa); outline-offset: 2px; }
  svg { width: 32px; height: 32px; stroke: var(--rosa); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .marco {
    width: min(430px, 100%);
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background-color: var(--hoja);
    background-image:
      radial-gradient(circle, rgba(212, 20, 90, .16) 1.1px, transparent 1.3px),
      radial-gradient(circle, rgba(20, 163, 154, .18) 1.1px, transparent 1.3px);
    background-size: 16px 18px, 22px 20px;
    background-position: 0 0, 8px 9px;
    padding: calc(4px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom));
  }
  .marco::before {
    content: "";
    flex: 0 0 32px;
    margin: 0 -12px 4px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='216' height='58' viewBox='0 0 216 58'><path d='M0 7H216' stroke='%235c3318' stroke-width='2'/><g fill='%23e2186a'><path d='M4 12h28v22l-14 9-14-9z'/></g><circle cx='18' cy='22' r='3.1' fill='%23fff6ec'/><circle cx='12' cy='31' r='1.7' fill='%23fff6ec'/><circle cx='24' cy='31' r='1.7' fill='%23fff6ec'/><g fill='%23f2c14e'><path d='M40 12h28v22l-14 9-14-9z'/></g><circle cx='54' cy='22' r='3.1' fill='%23fff6ec'/><circle cx='48' cy='31' r='1.7' fill='%23fff6ec'/><circle cx='60' cy='31' r='1.7' fill='%23fff6ec'/><g fill='%2314a39a'><path d='M76 12h28v22l-14 9-14-9z'/></g><circle cx='90' cy='22' r='3.1' fill='%23fff6ec'/><circle cx='84' cy='31' r='1.7' fill='%23fff6ec'/><circle cx='96' cy='31' r='1.7' fill='%23fff6ec'/><g fill='%23f26522'><path d='M112 12h28v22l-14 9-14-9z'/></g><circle cx='126' cy='22' r='3.1' fill='%23fff6ec'/><circle cx='120' cy='31' r='1.7' fill='%23fff6ec'/><circle cx='132' cy='31' r='1.7' fill='%23fff6ec'/><g fill='%237a2e86'><path d='M148 12h28v22l-14 9-14-9z'/></g><circle cx='162' cy='22' r='3.1' fill='%23fff6ec'/><circle cx='156' cy='31' r='1.7' fill='%23fff6ec'/><circle cx='168' cy='31' r='1.7' fill='%23fff6ec'/><g fill='%232f9b4a'><path d='M184 12h28v22l-14 9-14-9z'/></g><circle cx='198' cy='22' r='3.1' fill='%23fff6ec'/><circle cx='192' cy='31' r='1.7' fill='%23fff6ec'/><circle cx='204' cy='31' r='1.7' fill='%23fff6ec'/></svg>");
    background-repeat: repeat-x;
    background-position: center top;
    background-size: 120px 32px;
  }
  .marco > section:not([hidden]) { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  #casa:not([hidden]) { overflow: auto; }
  section[hidden], [hidden] { display: none !important; }
  h1 { font-family: var(--serif); font-weight: 680; font-size: 26px; letter-spacing: -0.03em; margin: 2px 0 4px; }
  p.ayuda { color: var(--suave); margin: 0 0 18px; max-width: 34ch; }
  .centro { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: center; }
  .dibujo { width: 56px; height: 56px; border-radius: 18px; background: #b7efea; display: grid; place-items: center; }
  .pozo { width: 48px; height: 48px; border-radius: 16px; background: var(--rosa); display: grid; place-items: center; }
  .pozo svg { stroke: #fff6ec; }
  #conectar .dibujo { width: 72px; height: 72px; border-radius: 22px; background: var(--rosa); }
  #conectar .dibujo svg { width: 36px; height: 36px; stroke: #fff6ec; }
  .aro { width: 112px; height: 112px; border-radius: 50%; background: var(--rosa); display: grid; place-items: center; margin: 0 0 8px; }
  .aro video { width: 112px; height: 112px; object-fit: cover; border-radius: 50%; }
  .aro.espera { animation: pulso 1.6s ease-in-out infinite; }
  @keyframes pulso { 50% { transform: scale(1.04); } }
  .tipos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 16px; }
  .tipos button { display: grid; justify-items: start; gap: 10px; padding: 14px; border-radius: 18px; background: var(--papel); color: var(--tinta); text-align: left; box-shadow: inset 0 0 0 1px var(--borde); }
  .tipos button.sel { background: var(--rosa); color: #fff6ec; box-shadow: none; }
  .tipos button.sel .dibujo { background: #fff6ec; }
  .tipos button.sel svg { stroke: var(--rosa); }
  .grande { width: 100%; background: var(--rosa); color: #fff6ec; border-radius: 16px; padding: 16px 18px; font-weight: 600; }
  .grande:disabled { opacity: .45; }
  .otros { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .otros button, #volver-cara { background: var(--papel); border-radius: 16px; padding: 14px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--borde); }
  #volver-cara { margin-top: 10px; color: var(--rosa); }
  header.barra { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  header.barra strong { font-family: var(--serif); font-size: 22px; }
  #quien { background: #f2c14e; color: var(--tinta); border: 0; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; font-weight: 600; }
  .grupo { margin: 12px 0 0; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--suave); }
  .cuadros { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cuadros button { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-height: 112px; text-align: left; padding: 12px; border-radius: 18px; background: var(--papel); box-shadow: inset 0 0 0 1px var(--borde); }
  .cuadros .nombre { font-weight: 600; }
  .cuadros .quiere { font-weight: 400; color: var(--suave); font-size: 14px; }
  .cuadros .sello, .alerta { background: #f2c14e; color: #3a2410; border-radius: 999px; padding: 3px 8px; font-size: 13px; font-weight: 600; }
  .alerta { display: block; border-radius: 14px; padding: 10px 12px; }
  .perfil { background: var(--papel); border-radius: 22px; padding: 14px 14px 12px; box-shadow: inset 0 0 0 1px var(--borde); display: grid; gap: 10px; }
  .perfil .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .perfil .tel { margin: 0; color: var(--suave); font-size: 15px; }
  .perfil .aviso { background: #f2c14e; color: #3a2410; border-radius: 999px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
  .perfil .pidio { margin: 0; font-family: var(--serif); font-size: 20px; line-height: 1.3; font-weight: 560; }
  .perfil .chips-dato { display: flex; flex-wrap: wrap; gap: 6px; }
  .perfil .chips-dato span { background: var(--hoja); border-radius: 999px; padding: 5px 10px; font-size: 14px; box-shadow: inset 0 0 0 1px var(--borde); }
  .perfil .suave { margin: 0; color: var(--suave); font-size: 14px; line-height: 1.35; }
  .perfil h3 { margin: 2px 0 0; font-family: var(--serif); font-size: 17px; font-weight: 560; }
  .perfil .corte { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; }
  .perfil .corte b { font-weight: 600; }
  .perfil .corte span { color: var(--suave); font-size: 14px; text-align: right; }
  .anaquel { display: grid; gap: 8px; }
  .anaquel > h3 { margin: 12px 0 0; font-family: var(--serif); font-size: 18px; font-weight: 560; }
  .pieza { background: var(--papel); border-radius: 18px; padding: 12px; box-shadow: inset 0 0 0 1px var(--borde); display: grid; gap: 8px; }
  .pieza .tope { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .pieza .tope strong { font-family: var(--serif); font-size: 18px; font-weight: 560; }
  .pieza .cuenta { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .metro { height: 8px; border-radius: 999px; background: #f3e6d8; overflow: hidden; }
  .metro i { display: block; height: 100%; background: #14a39a; border-radius: 999px; }
  .metro.bajo i { background: #f26522; }
  .metro.vacio i { width: 0; }
  .paso { display: flex; align-items: center; justify-content: space-between; }
  .paso button { width: 44px; height: 44px; border-radius: 14px; background: var(--hoja); font-size: 22px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--borde); }
  .paso button:disabled { opacity: .35; }
  .pieza .suave { margin: 0; color: var(--suave); font-size: 14px; line-height: 1.35; }
  .pieza .corte { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .pieza .corte b { font-weight: 600; }
  .pieza .corte span { color: var(--suave); font-size: 14px; text-align: right; }
  .pieza.corta { grid-template-columns: 56px 1fr auto; align-items: center; }
  .pieza.corta .pozo { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; color: #fff6ec; }
  .pieza.corta .pozo svg { width: 32px; height: 32px; fill: currentColor; stroke: none; }
  .pieza.corta .suave { margin: 0; }
  .pieza.corta strong { font-family: var(--serif); font-size: 17px; font-weight: 560; }
  .lado { display: grid; justify-items: end; gap: 4px; }
  .lado b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .mini { display: flex; gap: 6px; }
  .mini button { width: 36px; height: 36px; border-radius: 12px; background: var(--hoja); font-size: 20px; font-weight: 600; box-shadow: inset 0 0 0 1px var(--borde); }
  .mini button:disabled { opacity: .35; }
  .malla .piezas { color: var(--suave); font-size: 13px; font-weight: 400; }
  .servicio { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 36px; }
  button.estrella { font-size: 22px; line-height: 1; min-width: 36px; min-height: 36px; color: var(--suave); }
  button.estrella.prendida { color: #f2c14e; }
  button.ya { background: var(--rosa); color: #fff6ec; border-radius: 999px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
  button.ya:disabled { opacity: .55; }
  a.grande { display: block; text-align: center; text-decoration: none; margin-top: 8px; }
  .cal-mes { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; margin-bottom: 4px; }
  .cal-mes strong { text-align: center; font-weight: 600; }
  .cal-mes button { font-size: 22px; color: var(--rosa); min-height: 36px; }
  .semana { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 8px; }
  .semana button { display: grid; justify-items: center; gap: 2px; padding: 2px 0 4px; }
  .semana .letra { font-size: 12px; color: var(--suave); }
  .semana .num { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; }
  .semana button.sel .num { background: var(--rosa); color: #fff6ec; }
  .semana .punto { width: 5px; height: 5px; border-radius: 50%; background: transparent; }
  .semana button.tiene .punto { background: #14a39a; }
  .semana button.sel.tiene .punto { background: var(--rosa); }
  .hora-fila { display: grid; grid-template-columns: 46px 1fr; min-height: 52px; }
  .hora-fila .hora { color: var(--suave); font-size: 12px; line-height: 1; }
  .carril { border-top: 1px solid var(--borde); min-height: 52px; padding: 2px 0 2px 6px; }
  .evento { display: block; width: 100%; text-align: left; background: #e7f7f5; border-radius: 8px; border-left: 4px solid #14a39a; padding: 6px 8px; min-height: 44px; }
  .evento strong { display: block; font-weight: 600; }
  .evento span { display: block; color: var(--suave); font-size: 13px; font-weight: 400; }
  .malla { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
  .malla button { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 8px; min-height: 132px; padding: 14px 8px 12px; border-radius: 24px; background: var(--papel); text-align: center; box-shadow: inset 0 0 0 1px var(--borde); }
  .malla .pozo { width: 76px; height: 76px; border-radius: 22px; }
  .malla .pozo svg { width: 46px; height: 46px; fill: currentColor; stroke: none; }
  .malla .pozo { color: #fff6ec; }
  .pozo.rosa { background: #d4145a; }
  .pozo.turquesa { background: #14a39a; }
  .pozo.naranja { background: #f26522; }
  .pozo.morado { background: #7a2e86; }
  .pozo.verde { background: #2f9b4a; }
  .pozo.amarillo { background: #f2c14e; color: #24160f; }
  .malla .pozo.amarillo { background: #f2c14e; color: #24160f; }
  .malla .pozo.turquesa { background: #14a39a; }
  .malla .pozo.naranja { background: #f26522; }
  .malla .pozo.verde { background: #2f9b4a; }
  .malla .pozo.morado { background: #7a2e86; }
  .malla .nombre { font-weight: 600; font-size: 15px; }
  .malla .grupo { grid-column: 1 / -1; margin: 8px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
  #cuerpo .fila { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--borde); }
  #cuerpo button.ancho { display: block; width: 100%; margin-top: 8px; background: var(--rosa); color: #fff6ec; border-radius: 16px; padding: 12px; font-weight: 700; }
  #frase { display: none; }
  .flecha { color: #14a39a; font-size: 22px; line-height: 1; }
  .volver { display: inline-flex; align-items: center; gap: 6px; background: var(--papel); color: var(--rosa); font-weight: 600; border-radius: 999px; padding: 8px 14px; margin-bottom: 8px; box-shadow: inset 0 0 0 1px var(--borde); }
  video.camara { width: 100%; max-height: 220px; object-fit: cover; border-radius: 16px; background: #24160f; margin: 8px 0; }
  img.codigo { width: 180px; height: 180px; background: #fff; border-radius: 16px; margin: 8px 0; }
  #detalle:not([hidden]) { display: flex; }
  #pie { flex-shrink: 0; display: grid; gap: 6px; padding-top: 6px; }
  #cuerpo { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-bottom: 28px; }
  #cuerpo.es-chat { overflow: hidden; padding-bottom: 0; }
  #cuerpo .monto { text-align: center; }
  .centro-texto { text-align: center; max-width: none; }
  #cuerpo .aro { margin: 12px auto 16px; }
  #log { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 12px; flex: 1; min-height: 0; overflow: auto; }
  .chips, form.linea { flex-shrink: 0; }
  .b { max-width: 88%; white-space: pre-wrap; padding: 10px 12px; }
  .user { align-self: flex-end; background: var(--rosa); color: #fff6ec; border-radius: 16px 16px 4px 16px; }
  .bot { align-self: flex-start; background: var(--papel); border-radius: 16px 16px 16px 4px; box-shadow: inset 0 0 0 1px var(--borde); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chips button { background: var(--papel); color: var(--tinta); border-radius: 999px; padding: 8px 12px; box-shadow: inset 0 0 0 1px var(--borde); }
  form.linea { display: flex; gap: 8px; align-items: center; background: var(--papel); border-radius: 16px; padding: 4px 4px 4px 14px; }
  form.linea input { flex: 1; border: 0; background: transparent; padding: 10px 0; }
  form.linea button { background: var(--rosa); color: #fff6ec; border-radius: 12px; padding: 10px 12px; font-weight: 600; }
  ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--papel); border-radius: 14px; }
  .vacio { color: var(--suave); }
  .caras { display: flex; gap: 10px; margin: 16px 0 12px; }
  .caras button { width: 56px; height: 56px; border-radius: 18px; background: var(--papel); display: grid; place-items: center; }
  .caras button.sel { background: var(--rosa); }
  .caras button.sel svg { stroke: #fff6ec; }
  .monto { font-family: var(--serif); font-size: 56px; margin: 0; letter-spacing: -0.04em; color: var(--rosa); }
  @media (max-width: 520px) { body { background: var(--hoja); } }
  @media (prefers-reduced-motion: reduce) { .aro.espera { animation: none; } }
</style>
</head>
<body>
<div class="marco">
  <section id="entrada">
    <div class="centro">
      <div class="aro" id="aro-login"></div>
      <h1>Entra</h1>
      <p class="ayuda" id="entrada-ayuda">Elige quién eres. La cámara guarda tu cara en este perfil. Después solo entra si eres tú.</p>
      <div class="tipos">
        <button type="button" id="soy-yo" class="sel">
          <span class="dibujo" data-dibujo="persona"></span>
          Yo
        </button>
        <button type="button" id="soy-negocio">
          <span class="dibujo" data-dibujo="tienda"></span>
          Mi negocio
        </button>
      </div>
      <button class="grande" id="entrar" type="button">Entrar con Face ID</button>
      <div class="otros">
        <button type="button" id="con-huella">Huella</button>
        <button type="button" id="con-correo">Correo</button>
      </div>
      <div id="paso-correo" hidden>
        <form class="linea" id="form-correo">
          <input id="correo" type="email" autocomplete="username" placeholder="tu@correo.com" aria-label="Correo">
          <button type="submit">Enviar</button>
        </form>
        <button class="grande" id="google" type="button" hidden style="margin-top:10px;background:#fffdf8;color:#24160f;box-shadow:inset 0 0 0 1px #efd3a4">Continuar con Google</button>
      </div>
      <div id="paso-codigo" hidden>
        <form class="linea" id="form-codigo">
          <input id="codigo" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="Código" aria-label="Código">
          <button type="submit">Verificar</button>
        </form>
        <p class="ayuda" id="codigo-local" hidden></p>
        <button type="button" id="volver-cara">‹ Face ID</button>
      </div>
    </div>
  </section>

  <section id="conectar" hidden>
    <div class="centro">
      <span class="dibujo" data-dibujo="whats"></span>
      <h1>Estética</h1>
      <p class="ayuda">Esta es la central. Las clientas y lo que buscan están en Clientas. La venta la hacen los agentes en Meta.</p>
      <button class="grande" id="conectar-wa" type="button">Entrar a la central</button>
    </div>
  </section>

  <section id="casa" hidden>
    <header class="barra">
      <strong>Anillo</strong>
      <button id="quien" type="button">Yo</button>
    </header>
    <p class="ayuda" id="frase">Entra a una cosa a la vez.</p>
    <div class="malla" id="malla"></div>
  </section>

  <section id="detalle" hidden>
    <button class="volver" id="volver" type="button">‹ Atrás</button>
    <h1 id="titulo"></h1>
    <div id="cuerpo"></div>
  </section>
</div>
<script>
const D = {
  persona: '<svg viewBox="0 0 80 80"><circle cx="40" cy="28" r="12"/><path d="M18 66c4-14 12-20 22-20s18 6 22 20"/></svg>',
  tienda: '<svg viewBox="0 0 80 80"><path d="M14 34h52l-6-14H20z"/><path d="M18 34v28h44V34"/><path d="M34 62V44h12v18"/></svg>',
  whats: '<svg viewBox="0 0 80 80"><rect x="22" y="12" width="28" height="52" rx="6"/><path d="M52 28h12a8 8 0 0 1 0 16H52"/><circle cx="36" cy="56" r="2" fill="currentColor" stroke="none"/></svg>',
  chat: '<svg viewBox="0 0 80 80"><path d="M16 20h40a8 8 0 0 1 8 8v18a8 8 0 0 1-8 8H32l-12 12v-12h-4a8 8 0 0 1-8-8V28a8 8 0 0 1 8-8z"/></svg>',

function tomarCara() {
  return new Promise((resolve) => {
    if (window.AnilloCara && window.AnilloCara.registrar) {
      const timer = setTimeout(() => resolve(null), 12000);
      window.anilloCaraLista = (ok, jpeg) => {
        clearTimeout(timer);
        resolve(ok && jpeg ? jpeg : null);
      };
      window.AnilloCara.registrar();
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      resolve(null);
      return;
    }
    navigator.mediaDevices.getUserMedia({video: {facingMode: "user"}, audio: false}).then((stream) => {
      const video = document.createElement("video");
      video.playsInline = true;
      video.muted = true;
      video.srcObject = stream;
      const aro = document.querySelector("#aro-login");
      aro.replaceChildren(video);
      video.onloadeddata = () => {
        video.play();
        setTimeout(() => {
          const canvas = document.createElement("canvas");
          canvas.width = 320;
          canvas.height = Math.max(1, Math.round(video.videoHeight * 320 / (video.videoWidth || 320)));
          canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
          stream.getTracks().forEach((t) => t.stop());
          aro.innerHTML = D.cara;
          resolve(canvas.toDataURL("image/jpeg", 0.75));
        }, 900);
      };
    }).catch(() => resolve(null));
  });
}

    const aviso = document.createElement("span");

  }
  f.appendChild(meta);
  const pidio = document.createElement("p");
  pidio.className = "pidio";
  pidio.textContent = c.pidio || "Todavía no pide nada.";
  f.appendChild(pidio);
  if (c.rol !== "proveedor") {
    const perfil = [c.veces, c.gasto_txt, c.ritmo].filter(Boolean);
    if (perfil.length) {
      const h = document.createElement("h3");
      h.textContent = "Perfil";
      f.append(h, chipsDe(perfil));
    }
  }
  if (c.rol === "proveedor") {
    const materiales = c.surte || [];
    if (materiales.length) {
      const h = document.createElement("h3");
      h.textContent = "Surte";
      f.append(h, chipsDe(materiales.map((s) => s.nombre)));
      const pide = materiales.filter((s) => s.pide).map((s) => s.nombre);
      if (pide.length) f.appendChild(lineaSuave("El almacén pide: " + pide.join(", ") + "."));
    }
    if (c.pedido) f.appendChild(pedidoDe(c.pedido));
    if (c.orden && c.orden.lineas) {
      const h = document.createElement("h3");
      h.textContent = "Orden";
      f.appendChild(h);
      f.appendChild(lineaSuave(c.orden.lineas.map((l) => l.nombre + " x" + l.cantidad).join(", ") + "."));
      const si = document.createElement("button");
      si.type = "button";
      si.className = "grande";
      si.textContent = "Sí, mándasela";
      si.onclick = () => aprobarOrden(c.orden.id, si);
      f.appendChild(si);
    }
  } else {
    const gustos = (c.interes || "").split(",").map((t) => t.trim()).filter((t) => t && !t.startsWith("No dijo"));
    for (const t of c.favoritos || []) if (t && !gustos.includes(t)) gustos.push(t);
    if (gustos.length) {
      const h = document.createElement("h3");
      h.textContent = "Le gusta";
      f.append(h, chipsDe(gustos));
    }
  }
  if (c.seguimiento) f.appendChild(lineaSuave(c.seguimiento));
  if (c.ultimo_uso && !String(c.ultimo_uso).startsWith("Todavía")) f.appendChild(lineaSuave("Lo último: " + c.ultimo_uso));
  if (c.formula && c.formula !== "Sin fórmula anotada") f.appendChild(lineaSuave("Fórmula: " + c.formula));
  if ((c.servicios || []).length) f.appendChild(serviciosDe(c));
  else if (c.rol !== "proveedor") f.appendChild(lineaSuave("Sin servicio pagado."));
  for (const m of c.margenes || []) {
    f.appendChild(lineaSuave("Insumos de " + m.servicio + ": " + m.insumos + (m.menu ? ". En el menú está en " + m.menu + "." : ".")));
  }
  const pres = c.presupuestos || [];
  if (pres.length) {
    const h = document.createElement("h3");
    h.textContent = "Presupuestos";
    const tabla = document.createElement("div");
    tabla.className = "corte";
    const grupos = new Map();
    for (const p of pres) {
      const nombre = p.conceptos || "Servicio";
      const pagado = p.saldo === "$0.00" || p.estado === "liquidada";
      const previo = grupos.get(nombre) || {pagado: false, abierto: false};
      if (pagado) previo.pagado = true;
      else previo.abierto = true;
      grupos.set(nombre, previo);
    }
    for (const [nombre, estado] of grupos) {
      const concepto = document.createElement("b");
      concepto.textContent = nombre;
      const marca = document.createElement("span");
      marca.textContent = estado.pagado && estado.abierto ? "Pagado y otro abierto" : (estado.pagado ? "Pagado" : "Por cobrar");
      tabla.append(concepto, marca);
    }
    f.append(h, tabla);
  }
  const ideas = (c.sugerencias || []).map((s) => s.nombre).filter(Boolean);
  if (ideas.length) {
    const h = document.createElement("h3");
    h.textContent = "Del menú";
    f.append(h, chipsDe(ideas));
  }
  if (c.respuesta) f.appendChild(lineaSuave("Le contestaste: " + c.respuesta));
  if (rolUi === "negocio" && c.rol !== "proveedor") f.appendChild(formulaDe(c.telefono));
  caja.appendChild(f);
  const pie = document.createElement("div");
  pie.id = "pie";
  const nota = document.createElement("p");
  nota.className = "ayuda";
  nota.id = "aviso-respuesta";
  const form = document.createElement("form");
  form.className = "linea";
  const input = campoTexto("Contestarle", "Respuesta");
  const enviar = document.createElement("button");
  enviar.textContent = "Enviar";
  form.append(input, enviar);
  form.onsubmit = async (ev) => {
    ev.preventDefault();
    const t = input.value.trim();
    if (!t || !c.telefono) return;
    input.value = "";
    enviar.disabled = true;
    const r = await fetch("/api/contestar?k=" + encodeURIComponent(clave), {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({desde: telefono, para: c.telefono, texto: t})
    });
    const data = await r.json().catch(() => ({}));
    enviar.disabled = false;
    nota.textContent = !r.ok
      ? (data.detail || "No se pudo guardar.")
      : (data.salio ? "Se envió por Meta." : "Quedó en la ficha. Meta no tiene las llaves, así que no salió al teléfono.");
    if (r.ok) pintar();
  };
  pie.append(form, nota);
  caja.parentElement.appendChild(pie);
}

async function abrirCamara(caja, aviso) {
  soltarCamara();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    aviso.textContent = "Este teléfono no soltó la cámara.";
    return;
  }
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}});
  } catch (e) {
    aviso.textContent = "No pude usar la cámara. Acepta el permiso y vuelve a picar.";
    return;
  }
  let video = document.querySelector("#video-scan");
  if (!video) {
    video = document.createElement("video");
    video.id = "video-scan";
    video.className = "camara";
    video.setAttribute("playsinline", "");
    video.muted = true;
    caja.appendChild(video);
  }
  video.srcObject = stream;
  await video.play();
  if (!("BarcodeDetector" in window)) {
    aviso.textContent = "La cámara está abierta, pero este visor no lee códigos. El de $0.01 sí se puede escanear desde otro teléfono.";
    return;
  }
  const det = new BarcodeDetector({formats: ["qr_code"]});
  leyendo = true;
  const paso = async () => {
    if (!leyendo || !video.isConnected) return;
    try {
      const codes = await det.detect(video);
      if (codes.length && codes[0].rawValue) {
        soltarCamara();
        await cobrarCodigo(codes[0].rawValue, caja, aviso);
        return;
      }
    } catch (e) {}
    setTimeout(paso, 350);
  };
  paso();
}

  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    aviso.textContent = data.detail || "Ese código no es de $0.01.";
    return;
  }
  caraDePago(caja, data);
}

}

const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const LETRAS = ["L", "M", "M", "J", "V", "S", "D"];
const CLAVES = ["lun", "mar", "mie", "jue", "vie", "sab", "dom"];

function isoDia(fecha) {
  const m = String(fecha.getMonth() + 1).padStart(2, "0");
  const d = String(fecha.getDate()).padStart(2, "0");
  return fecha.getFullYear() + "-" + m + "-" + d;
}

function fechaDia(iso) {
  return new Date(iso + "T12:00:00");
}

function lunesDe(iso) {
  const fecha = fechaDia(iso);
  const delta = (fecha.getDay() + 6) % 7;
  fecha.setDate(fecha.getDate() - delta);
  return isoDia(fecha);
}

function sumarDias(iso, n) {
  const fecha = fechaDia(iso);
  fecha.setDate(fecha.getDate() + n);
  return isoDia(fecha);
}

function franjasDe(inicio, fin, paso) {
  const horas = [];
  let [h, m] = inicio.split(":").map(Number);
  const [hf, mf] = fin.split(":").map(Number);
  const limite = hf * 60 + mf;
  while (h * 60 + m < limite) {
    horas.push(String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0"));
    m += paso;
    h += Math.floor(m / 60);
    m %= 60;
  }
  return horas;
}

function agenda(caja) {
  const ag = (datos && datos.agenda) || {inicio: "10:00", fin: "19:00", intervalo: 60, citas: []};
  const citas = ag.citas || [];
  if (citaAbierta) {
    const fresco = citas.find((c) => c.inicio === citaAbierta.inicio && c.telefono === citaAbierta.telefono);
    if (fresco) citaAbierta = fresco;
    const c = citaAbierta;
    const f = document.createElement("article");
    f.className = "perfil";
    const cuando = (c.inicio || "").slice(0, 16).replace("T", " ");
    f.appendChild(lineaSuave(cuando));
    const hecho = document.createElement("p");
    hecho.className = "pidio";
    hecho.textContent = c.servicio || "Sin servicio";
    f.appendChild(hecho);
    const gusto = (c.preferencia || "").split(",").map((t) => t.trim()).filter((t) => t && !t.startsWith("Todavía"));
    if (gusto.length) f.appendChild(chipsDe(gusto));
    if (c.nota) f.appendChild(lineaSuave(c.nota));
    if (c.gasto && c.gasto !== "Sin pago registrado") f.appendChild(lineaSuave("La vez pasada: " + c.gasto));
    if (c.ultimo && !String(c.ultimo).startsWith("Todavía")) f.appendChild(lineaSuave("Lo último: " + c.ultimo));
    if (c.formula && c.formula !== "Sin fórmula anotada") f.appendChild(lineaSuave("Fórmula: " + c.formula));
    if (rolUi === "negocio" && (c.servicios || []).length) f.appendChild(serviciosDe(c));
    const volver = document.createElement("button");
    volver.type = "button";
    volver.className = "grande";
    volver.style.marginTop = "8px";
    volver.textContent = "Ver el horario";
    volver.onclick = () => { citaAbierta = null; dibujar(); };
    caja.appendChild(f);
    if (rolUi === "negocio") caja.appendChild(formulaDe(c.telefono));
    caja.appendChild(volver);
    return;
  }
  const hoy = isoDia(new Date());
  const diasConCita = new Set(citas.map((c) => c.inicio.slice(0, 10)));
  if (!diaAgenda) diaAgenda = diasConCita.has(hoy) ? hoy : ([...diasConCita][0] || hoy);
  const lunes = lunesDe(diaAgenda);
  const encabezado = document.createElement("div");
  encabezado.className = "cal-mes";
  const anterior = document.createElement("button");
  anterior.type = "button";
  anterior.textContent = "‹";
  anterior.setAttribute("aria-label", "Semana anterior");
  anterior.onclick = () => { diaAgenda = sumarDias(diaAgenda, -7); dibujar(); };
  const titulo = document.createElement("strong");
  titulo.textContent = MESES[fechaDia(diaAgenda).getMonth()];
  const siguiente = document.createElement("button");
  siguiente.type = "button";
  siguiente.textContent = "›";
  siguiente.setAttribute("aria-label", "Semana siguiente");
  siguiente.onclick = () => { diaAgenda = sumarDias(diaAgenda, 7); dibujar(); };
  encabezado.append(anterior, titulo, siguiente);
  caja.appendChild(encabezado);
  const semana = document.createElement("div");
  semana.className = "semana";
  for (let i = 0; i < 7; i++) {
    const iso = sumarDias(lunes, i);
    const b = document.createElement("button");
    b.type = "button";
    if (iso === diaAgenda) b.classList.add("sel");
    if (diasConCita.has(iso)) b.classList.add("tiene");
    const letra = document.createElement("span");
    letra.className = "letra";
    letra.textContent = LETRAS[i];
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = String(Number(iso.slice(8)));
    const punto = document.createElement("span");
    punto.className = "punto";
    b.append(letra, num, punto);
    b.onclick = () => { diaAgenda = iso; citaAbierta = null; dibujar(); };
    semana.appendChild(b);
  }
  caja.appendChild(semana);
  const claveDia = CLAVES[(fechaDia(diaAgenda).getDay() + 6) % 7];
  const abiertos = ag.dias || ["lun", "mar", "mie", "jue", "vie", "sab"];
  if (!abiertos.includes(claveDia)) {
    caja.appendChild(lineaSuave("Domingo. Cerrado."));
    return;
  }
  const rejilla = document.createElement("div");
  const delDia = citas.filter((c) => c.inicio.slice(0, 10) === diaAgenda);
  for (const hora of franjasDe(ag.inicio, ag.fin, ag.intervalo || 60)) {
    const fila = document.createElement("div");
    fila.className = "hora-fila";
    const etiqueta = document.createElement("span");
    etiqueta.className = "hora";
    etiqueta.textContent = hora;
    const carril = document.createElement("div");
    carril.className = "carril";
    const ocupada = delDia.find((c) => c.inicio.slice(11, 16) === hora);
    if (ocupada) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "evento";
      const nombre = document.createElement("strong");
      nombre.textContent = ocupada.nombre;
      const detalle = document.createElement("span");
      detalle.textContent = ocupada.estado === "confirmada" ? (ocupada.servicio || "Cita") : "Por confirmar";
      b.append(nombre, detalle);
      b.onclick = () => { citaAbierta = ocupada; dibujar(); };
      carril.appendChild(b);
    }
    fila.append(etiqueta, carril);
    rejilla.appendChild(fila);
  }
  caja.appendChild(rejilla);
}

function pedidoDe(pedido) {
  const caja = document.createElement("div");
  caja.className = "anaquel";
  const h = document.createElement("h3");
  h.textContent = "Pedido";
  caja.appendChild(h);
  caja.appendChild(lineaSuave("Llega: " + pedido.cuando));
  caja.appendChild(lineaSuave("Dice que trae: " + pedido.trae));
  caja.appendChild(lineaSuave("Factura: " + pedido.factura));
  const cotejo = document.createElement("p");
  cotejo.className = "alerta";
  cotejo.textContent = pedido.cotejo;
  caja.appendChild(cotejo);
  return caja;
}

function textoMovimiento(m) {
  if (m.tipo === "salida") return "Salió " + m.cantidad;
  if (m.tipo === "entrada") return "Entró " + m.cantidad;
  return "Conteo " + (m.nota && m.nota.indexOf("Sube") >= 0 ? "+" : "−") + m.cantidad;
}

const ANAQUELES = [
  ["Tintes", "frasco", "rosa"],
  ["Limpieza", "spray", "turquesa"],
  ["Manicura", "una", "morado"],
  ["Varios", "cajas", "naranja"]
];

function dibujoDe(sku) {
  if (sku === "tinte") return "frasco";
  if (sku === "papel-bano") return "rollo";
  if (sku === "papel-aluminio") return "lamina";
  const seccion = (ANAQUELES.find((s) => s[0] === sku) || [])[1];
  return seccion || "cajas";
}

function tintaDe(seccion) {
  const fila = ANAQUELES.find((s) => s[0] === seccion);
  return fila ? fila[2] : "amarillo";
}

function precioDe(p) {
  const costos = [];
  for (const lote of p.lotes || []) if (lote.costo && !costos.includes(lote.costo)) costos.push(lote.costo);
  return costos.length ? costos.join(" · ") : "Sin precio";
}

function modulos() {
  return (datos && datos.modulos) || {caja: [], recetas: [], facturas: [], personal: [], ventas: []};
}

function pesosDe(centavos) {
  const n = Math.round(Number(centavos) || 0);
  const signo = n < 0 ? "-" : "";
  const abs = Math.abs(n);
  return signo + "$" + Math.floor(abs / 100) + "." + String(abs % 100).padStart(2, "0");
}

function cajaVista(caja) {
  const productos = modulos().caja || [];
  if (!productos.length) {
    caja.appendChild(lineaSuave("La caja no tiene productos."));
    return;
  }
  for (const p of productos) {
    const fila = document.createElement("div");
    fila.className = "fila";
    const nombre = document.createElement("div");
    nombre.innerHTML = "<strong>" + p.nombre + "</strong><br><span>" + p.precio + " · quedan " + p.existencia + "</span>";
    const mas = document.createElement("button");
    mas.type = "button";
    mas.textContent = (carrito[p.sku] || 0) ? "×" + carrito[p.sku] : "+";
    mas.onclick = () => {
      if ((carrito[p.sku] || 0) >= p.existencia) return;
      carrito[p.sku] = (carrito[p.sku] || 0) + 1;
      dibujar();
    };
    fila.append(nombre, mas);
    caja.appendChild(fila);
  }
  const total = productos.reduce((suma, p) => suma + (carrito[p.sku] || 0) * p.precio_centavos, 0);
  const pie = document.createElement("p");
  pie.className = "alerta";
  pie.textContent = "Total " + pesosDe(total);
  caja.appendChild(pie);
  const efectivo = document.createElement("button");
  efectivo.type = "button";
  efectivo.className = "ancho";
  efectivo.textContent = "Cobrar en efectivo";
  efectivo.onclick = cobrarCaja;
  const codi = document.createElement("button");
  codi.type = "button";
  codi.className = "ancho";
  codi.textContent = "Cobrar con CoDi";
  codi.onclick = () => empujar({vista: "banco", nombre: "Banco"});
  caja.append(efectivo, codi);
  caja.appendChild(lineaSuave("CoDi se confirma en Banco. Aquí no se marca pagado."));
}

async function cobrarCaja() {
  const lineas = Object.entries(carrito).filter(([, n]) => n > 0).map(([sku, cantidad]) => ({sku, cantidad}));
  if (!lineas.length) return;
  const r = await fetch("/api/venta?k=" + encodeURIComponent(clave), {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({telefono10: telefono, lineas})
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) {
    alert(data.detail || "No se pudo cobrar.");
    return;
  }
  carrito = {};
  await pintar();
  alert("Venta registrada: " + data.total);
}

function pedidosVista(caja) {
  const citas = (datos && datos.citas) || [];
  const compras = ((datos && datos.chats) || []).filter((c) => c.pedido);
  if (!citas.length && !compras.length) {
    caja.appendChild(lineaSuave("No hay pedidos."));
    return;
  }
  for (const c of citas) {
    caja.appendChild(lineaSuave((c.quien || "Pedido") + " · " + (c.inicio || "") + " · " + (c.estado || "")));
  }
  for (const c of compras) {
    caja.appendChild(lineaSuave(c.nombre + " · " + (c.pedido.cuando || "")));
  }
}

function recetasVista(caja) {
  const recetas = modulos().recetas || [];
  if (!recetas.length) {
    caja.appendChild(lineaSuave("No hay recetas."));
    return;
  }
  for (const r of recetas) {
    const texto = r.servicio + ": " + r.insumos.map((i) => i.nombre + " ×" + i.cantidad).join(", ");
    caja.appendChild(lineaSuave(texto));
  }
  caja.appendChild(lineaSuave("La receta baja el anaquel cuando el servicio ya quedó, no cuando se cobra."));
}

function dineroVista(caja) {
  lista(caja, [["Cobrado", datos.mes.cobrado],["Apartado SAT", datos.mes.apartado],["Puedes usar", datos.mes.disponible]], "");
  const titulo = document.createElement("p");
  titulo.className = "grupo";
  titulo.textContent = "Ventas";
  caja.appendChild(titulo);
  ventasVista(caja);
}

function perfilVista(caja) {
  const quien = (datos && datos.quien) || {};
  caja.appendChild(lineaSuave((quien.nombre || "Tu cuenta") + " · " + (quien.rol || "")));
  const titulo = document.createElement("p");
  titulo.className = "grupo";
  titulo.textContent = "Personal";
  caja.appendChild(titulo);
  personalVista(caja);
  const seguridad = document.createElement("button");
  seguridad.type = "button";
  seguridad.className = "ancho";
  seguridad.textContent = "Seguridad";
  seguridad.onclick = () => empujar({vista: "seguridad", nombre: "Seguridad"});
  caja.appendChild(seguridad);
}

function ventasVista(caja) {
  const propias = (modulos().ventas || []).map((v) => [v.concepto + " · " + v.metodo, v.total]);
  const cobros = ((datos && datos.cobros) || []).filter((c) => c.estado === "pagado").map((c) => [c.concepto, c.monto]);
  lista(caja, [...propias, ...cobros], "Aún no hay ventas.");
}

function facturasVista(caja) {
  const filas = (modulos().facturas || []).map((f) => [f.folio, f.estado]);
  lista(caja, filas, "No hay facturas. El timbrado sigue simulado.");
}

function personalVista(caja) {
  const gente = (modulos().personal || []).map((p) => [p.nombre, p.rol]);
  lista(caja, gente, "Aún no hay personal.");
  caja.appendChild(lineaSuave("El personal ve cantidades. No ve costos ni finanzas."));
}

function almacenVista(caja) {
  const productos = (datos && datos.almacen) || [];
  const pedidos = ((datos && datos.chats) || []).filter((c) => c.rol === "proveedor" && c.pedido);
  if (pedidos.length) {
    const linea = document.createElement("p");
    linea.className = "alerta";
    const p = pedidos[0].pedido;
    linea.textContent = pedidos[0].nombre + " · " + p.cuando + ". " + p.cotejo;
    caja.appendChild(linea);
  }
  const malla = document.createElement("div");
  malla.className = "malla";
  for (const [nombre, icono, tinta] of ANAQUELES) {
    const deAhi = productos.filter((item) => (item.seccion || "Varios") === nombre);
    const piezas = deAhi.reduce((suma, item) => suma + item.existencia, 0);
    const b = document.createElement("button");
    b.type = "button";
    b.innerHTML = '<span class="pozo ' + tinta + '">' + (D[icono] || "") + '</span><span class="nombre">' + nombre + '</span><span class="piezas">' + (deAhi.length ? piezas + (piezas === 1 ? " pieza" : " piezas") : "Vacío") + '</span>';
    b.onclick = () => empujar({vista: "anaquel", nombre: nombre, seccion: nombre});
    malla.appendChild(b);
  }
  caja.appendChild(malla);
  caja.appendChild(cargador());
}

function anaquelDe(caja) {
  const nombre = (pila[pila.length - 1] || {}).seccion || "";
  const productos = ((datos && datos.almacen) || []).filter((item) => (item.seccion || "Varios") === nombre);
  if (!productos.length) {
    caja.appendChild(lineaSuave("Todavía no hay productos en " + nombre + "."));
    return;
  }
  for (const p of productos) caja.appendChild(piezaDe(p));
}

function piezaDe(p) {
  const art = document.createElement("article");
  art.className = "pieza corta";
  const icono = document.createElement("span");
  icono.className = "pozo " + tintaDe(p.seccion);
  icono.innerHTML = D[dibujoDe(p.sku)] || D.cajas;
  const info = document.createElement("div");
  const nombre = document.createElement("strong");
  nombre.textContent = p.nombre;
  const sku = document.createElement("p");
  sku.className = "suave";
  sku.textContent = "SKU " + p.sku;
  const costo = document.createElement("p");
  costo.className = "suave";
  const lotes = (p.lotes || []).map((lote) => lote.cantidad + " a " + lote.costo).join(" · ");
  costo.textContent = lotes || precioDe(p);
  info.append(nombre, sku, costo);
  const lado = document.createElement("div");
  lado.className = "lado";
  const cuenta = document.createElement("b");
  cuenta.textContent = String(p.existencia);
  const paso = document.createElement("div");
  paso.className = "mini";
  const menos = document.createElement("button");
  menos.type = "button";
  menos.textContent = "−";
  menos.disabled = p.existencia <= 0;
  menos.setAttribute("aria-label", "Bajar " + p.nombre);
  const mas = document.createElement("button");
  mas.type = "button";
  mas.textContent = "+";
  mas.setAttribute("aria-label", "Subir " + p.nombre);
  menos.onclick = () => contar(p.sku, -1, menos);
  mas.onclick = () => contar(p.sku, 1, mas);
  paso.append(menos, mas);
  lado.append(cuenta, paso);
  art.append(icono, info, lado);
  const usos = (p.movimientos || []).slice(0, 2).map(textoMovimiento);
  if (usos.length) {
    const mov = lineaSuave(usos.join(" · "));
    mov.style.gridColumn = "1 / -1";
    art.appendChild(mov);
  }
  return art;
}

async function contar(sku, delta, boton) {
  const signo = delta < 0 ? "−" : "+";
  boton.disabled = true;
  const r = await fetch("/api/almacen/ajustar?k=" + encodeURIComponent(clave), {
    method: "POST",
    headers: cabeceras(true),
    body: JSON.stringify({telefono10: telefono, sku: sku, delta: delta})
  });
  await r.json().catch(() => ({}));
  boton.disabled = false;
  boton.textContent = signo;
  if (r.ok) pintar();
}

function lista(caja, filas, vacio) {
  const ul = document.createElement("ul");
  if (!filas.length && vacio) {
    const li = document.createElement("li");
    li.className = "vacio";
    li.textContent = vacio;
    ul.appendChild(li);
  }
  for (const [a, b] of filas) {
    const li = document.createElement("li");
    const i = document.createElement("span");
    const d = document.createElement("span");
    i.textContent = a;
    d.textContent = b;
    li.append(i, d);
    ul.appendChild(li);
  }
  caja.appendChild(ul);
}

function resenas(caja) {
  const nota = document.createElement("p");
  nota.className = "ayuda";
  nota.textContent = "La reseña no se escribe aquí. Cuando la clienta escanea el código y el banco confirma el pago, le sale gracias por su compra y el botón la lleva a Google para calificar.";
  caja.appendChild(nota);
}

if (!clave) {
  document.querySelector("#entrar").disabled = true;
  document.querySelector(".ayuda").textContent = "Falta la clave de esta máquina en el enlace.";
}
